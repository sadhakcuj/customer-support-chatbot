name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
      - run: python -m eval.run_eval

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t support-chatbot:ci .
      - name: Smoke test container
        run: |
          docker run -d --name b -p 8000:8000 -e BOT_API_KEYS=ci-key support-chatbot:ci
          for i in $(seq 1 20); do curl -fsS localhost:8000/readyz && break || sleep 1; done
          curl -fsS -X POST localhost:8000/v1/chat -H 'X-API-Key: ci-key' \
            -H 'Content-Type: application/json' -d '{"message":"What are your business hours?"}'
